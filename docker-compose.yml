services:
  status-poller:
    image: ghcr.io/gzuercher/status-page-to-chat:latest
    container_name: status-page-to-chat
    restart: unless-stopped
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL:?WEBHOOK_URL must be set in .env or stack environment}
      CONFIG_PATH: /data/providers.yaml
      # Bearer token guarding the management API. Required unless you set
      # API_AUTH_DISABLED=true (only do that behind a private network).
      API_TOKEN: ${API_TOKEN:-}
      # API_AUTH_DISABLED: "true"
      # Optional overrides:
      # API_PORT: "8080"
      # POLL_CRON: "*/5 * * * *"
      # LOG_LEVEL: info
      # USER_AGENT: "status-page-to-chat/1.0.0 (+https://example.com; ops@example.com)"
      # HEALTH_MAX_AGE_SECONDS: "900"
    ports:
      # Management API. Bind to localhost if you put a reverse proxy in
      # front; expose to the LAN if you trust your network.
      - "127.0.0.1:8080:8080"
    volumes:
      # Holds both state.sqlite AND providers.yaml. The container seeds
      # an empty providers.yaml from /app/providers.yaml.example on first
      # start, so `docker compose up -d` works with no host-side files.
      #
      # To inspect/edit providers from the host: use the REST API (see
      # docs/API.md, docs/LLM-INTEGRATION.md), or
      #   docker compose cp status-poller:/data/providers.yaml ./providers.yaml
      #   $EDITOR providers.yaml
      #   docker compose cp ./providers.yaml status-poller:/data/providers.yaml
      # (next poll cycle within 5 min picks the change up).
      - state:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  state:
