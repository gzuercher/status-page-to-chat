services:
  status-poller:
    image: ghcr.io/gzuercher/status-page-to-chat:latest
    container_name: status-page-to-chat
    restart: unless-stopped
    environment:
      WEBHOOK_URL: ${WEBHOOK_URL:?WEBHOOK_URL must be set in .env or stack environment}
      CONFIG_PATH: /data/providers.yaml
      # Optional overrides:
      # POLL_CRON: "*/5 * * * *"
      # LOG_LEVEL: info
      # USER_AGENT: "status-page-to-chat/1.0.0 (+https://example.com; ops@example.com)"
      # HEALTH_MAX_AGE_SECONDS: "900"
    volumes:
      # SQLite state. Survives container restarts and image updates.
      - state:/data
      # The list of monitored providers. Edit this file on the host —
      # the next poll cycle (every 5 min) picks up the change. Copy
      # providers.yaml.example to providers.yaml before first start.
      - ./providers.yaml:/data/providers.yaml:rw
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  state:
