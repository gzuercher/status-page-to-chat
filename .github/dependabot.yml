version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # TypeScript 7.x crashes typescript-eslint 8.x at lint time
      # (TypeError: reading 'Cjs'). Hold at 6.x until typescript-eslint
      # officially supports TS 7, then bump both together. See lessons.md.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Dependabot proposes whatever Node tag is newest, which is how it
      # offered 22 → 25. Odd-numbered Node releases are never LTS: 25 goes
      # out of support long before 24 "Krypton" does, so taking it would
      # have moved production onto a shorter support window while looking
      # like an upgrade.
      #
      # Major moves are therefore made by hand, LTS to LTS. Patch and minor
      # updates of the current tag still come through automatically.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
