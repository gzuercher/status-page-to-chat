name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # better-sqlite3 ships prebuilt native modules per Node major. The
      # pnpm store cache (cache: pnpm above) can carry a binding from a
      # prior CI run that ran on a different Node version, leading to
      # "Module did not self-register" / NODE_MODULE_VERSION mismatch.
      # Forcing a rebuild compiles against the current node binary.
      - name: Rebuild native modules for current Node
        run: pnpm rebuild better-sqlite3

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true
