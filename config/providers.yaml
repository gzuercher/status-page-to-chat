# Provider configuration as run in production (Raptus AG, teth.rserver.ch).
#
# Reference copy only: the running container reads /data/providers.yaml in
# its data volume (CONFIG_PATH), not this file. This file is baked into the
# image and used only when CONFIG_PATH is unset (fork-based workflow).
#
# To change production: `docker compose cp` the live file out, edit, copy
# it back — the next poll cycle (within 5 min) picks it up. Then mirror the
# change here.
#
# Removed on 2026-09-25: cloudflare (minImpact "major" filtered out every
# incident), shopify (no incidents published since 2025-06, outages only
# as component status), langdock (moved to incident.io).
#
# Schema and adapter docs: docs/CONFIGURATION.md, docs/ADAPTERS.md.

chatTarget: teamsJson # einziges unterstuetztes Ziel; die Logic App rendert die Karte

# Lowest severity that still produces a card. "minor" drops only "none"
# (informational notices). Do NOT raise this globally: most vendors class a
# real, user-visible degradation as "minor" and reserve "major" for a total
# outage — at "major" we missed roughly three quarters of what Anthropic and
# GitHub reported. Dampen loud sources per provider instead (`minImpact` on the entry).
# Only atlassian-statuspage publishes a severity. Per provider overridable.
minImpact: minor

providers:
  - key: claude
    displayName: Claude
    description: "KI-Assistent und API von Anthropic."
    adapter: atlassian-statuspage
    # Nicht status.claude.com: dessen Zertifikat deckt nur *.statuspage.io
    # ab, die TLS-Pruefung schlaegt fehl (seit 2026-08-13, von Anthropic
    # selbst als Incident gemeldet). anthropic.statuspage.io ist dieselbe
    # Seite (page id tymt9n04zgry) unter dem Namen, den das Zertifikat
    # traegt. Zurueckstellen, sobald das Custom-Domain-Zertifikat wieder
    # gueltig ist -- noetig ist es dann aber nicht.
    baseUrl: https://anthropic.statuspage.io
    componentFilter: claude.ai, Claude Code, api.anthropic.com
    # Ohne dies leitet der Adapter das Kartenlogo aus baseUrl ab und wuerde
    # das Statuspage-Logo statt der Marke Claude zeigen.
    logoUrl: https://t0.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE%2CSIZE%2CURL&size=64&url=https%3A%2F%2Fclaude.com
